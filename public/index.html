<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>RE-Change</title>

  <!-- Telegram Web Apps API -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

<!-- ЭКРАН 1: ОБМЕН -->
<div class="screen" id="screen-exchange">

  <h1 class="logo">RE-Change</h1>

  <div class="exchange-card">

    <!-- ОТДАЮ -->
    <div class="exchange-block">
      <div class="exchange-header">
        <span>Отдаю</span>
        <button class="currency-btn">RUB</button>
      </div>

      <input
              type="number"
              class="amount-input"
              placeholder="Сумма"
      />
    </div>

    <div class="divider"></div>

    <!-- ПОЛУЧАЮ -->
    <div class="exchange-block">
      <div class="exchange-header">
        <span>Получаю</span>
        <button class="currency-btn">USD</button>
      </div>

      <input
              type="number"
              class="amount-input"
              placeholder="Сумма"
      />
    </div>

  </div>

  <button class="pay-btn" id="toFormBtn">Оплатить</button>
</div>

<!-- ЭКРАН 2: ФОРМА -->
  <div class="screen hidden" id="screen-form">
    <h2>Введите данные</h2>

    <div class="field">
      <input id="fullName" placeholder="ФИО">
      <div class="error" id="error-fullName"></div>
    </div>

    <div class="field">
      <input id="email" placeholder="E-mail">
      <div class="error" id="error-email"></div>
    </div>

    <div class="field">
      <input id="phone" placeholder="Телефон">
      <div class="error" id="error-phone"></div>
    </div>

    <div class="field">
      <input id="cardNumber" placeholder="Номер карты">
      <div class="error" id="error-cardNumber"></div>
    </div>

    <button id="toConfirmBtn" disabled>Продолжить</button>
  </div>

<!-- ЭКРАН 3: ПОДТВЕРЖДЕНИЕ -->
<div class="screen hidden" id="screen-confirm">
  <h2>Проверьте данные</h2>

  <div id="confirmData"></div>

  <button id="confirmDealBtn">Подтвердить</button>
</div>

<!-- ЭКРАН 4: ОПЛАТА -->
<div class="screen hidden" id="screen-payment">
  <h2>Оплата</h2>

  <p>Банк: Tinkoff</p>
  <p>Карта: 4444 3333 2222 1111</p>
  <p id="paymentAmount"></p>

  <button id="paidBtn">Я оплатил</button>
</div>

<!-- ЭКРАН 5: УСПЕХ -->
<div class="screen hidden" id="screen-success">
  <h2>Спасибо за сделку</h2>
  <p>Деньги будут отправлены в течение 30 минут</p>
  <p id="finalDealNumber"></p>
</div>

</div>
<script src="app.js"></script>
</body>
</html>
